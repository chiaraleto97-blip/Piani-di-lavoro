name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controllo della sintassi
        run: for f in js/*.js tests/*.js; do node --check "$f"; done
      - name: Test
        run: npm test
